<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蛋白质评估 - 蛋白评估系统</title>
    <link rel="stylesheet" href="/static/css/template-ui-new.css?v=2">
    <style>
        /* Header actions positioned to the right */
        .template-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-4) var(--space-6);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-shrink: 0;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-left: auto;
            margin-right: var(--space-4);
        }

        .header-nav .nav-link {
            padding: var(--space-2) var(--space-4);
            font-size: 0.875rem;
            font-weight: 500;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
        }

        .header-actions {
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }

        /* Language toggle button - high contrast */
        #lang-toggle {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-weight: 700;
            padding: var(--space-2) var(--space-5);
            border-radius: var(--radius-lg);
            transition: all var(--transition);
            font-size: 0.875rem;
            min-height: 40px;
            min-width: 50px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        #lang-toggle:hover {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        /* Demo-specific additions */
        .target-tag {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-2);
            background: var(--primary-light);
            color: var(--primary-hover);
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 500;
            font-family: var(--font-mono);
        }

        /* Stats grid from demo */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-5);
            text-align: center;
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            border-top: 3px solid var(--gray-300);
        }

        .stat-card.running { border-top-color: var(--info); }
        .stat-card.pending { border-top-color: var(--warning); }
        .stat-card.completed { border-top-color: var(--success); }
        .stat-card.failed { border-top-color: var(--danger); }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1;
            margin-bottom: var(--space-2);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--gray-500);
            font-weight: 500;
        }

        /* Jobs grid */
        .jobs-grid {
            display: grid;
            gap: var(--space-4);
        }

        .job-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .job-card-header {
            padding: var(--space-4);
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-title {
            font-weight: 600;
            color: var(--gray-900);
        }

        .job-meta {
            display: flex;
            gap: var(--space-4);
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .job-info {
            padding: var(--space-4);
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
            padding: var(--space-3);
            background: var(--gray-50);
            border-radius: var(--radius-lg);
        }

        .filter-buttons {
            display: flex;
            gap: var(--space-2);
        }

        .filter-btn {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--gray-200);
            background: white;
            border-radius: var(--radius);
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .search-input {
            flex: 1;
            padding: var(--space-2) var(--space-4);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.875rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* View toggle */
        .view-toggle {
            display: flex;
            gap: var(--space-1);
            background: white;
            padding: var(--space-1);
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
        }

        .view-btn {
            padding: var(--space-2);
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all var(--transition);
            color: var(--gray-500);
        }

        .view-btn:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .view-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Jobs container */
        .jobs-container {
            display: grid;
            gap: var(--space-4);
        }

        .jobs-container.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .jobs-container.list-view {
            grid-template-columns: 1fr;
        }

        /* Job card improvements */
        .job-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-light);
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-3);
        }

        /* List view job card */
        .job-card-list {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) var(--space-4);
        }

        .job-card-list-main {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .job-list-meta {
            font-size: 0.8rem;
            color: var(--gray-500);
        }

        .job-card-list-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--space-2);
            min-width: 100px;
        }

        /* Job title section - flat design */
        .job-title-section {
            display: flex;
            align-items: flex-start;
            gap: var(--space-4);
            padding: var(--space-5) 0;
            border-bottom: 2px solid var(--gray-200);
            margin-bottom: var(--space-5);
        }

        .job-status-indicator {
            width: 6px;
            height: 60px;
            border-radius: 3px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .job-status-indicator.status-pending { background: linear-gradient(180deg, #fbbf24, #f59e0b); }
        .job-status-indicator.status-running,
        .job-status-indicator.status-processing { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
        .job-status-indicator.status-completed { background: linear-gradient(180deg, #4ade80, #22c55e); }
        .job-status-indicator.status-failed { background: linear-gradient(180deg, #f87171, #ef4444); }
        .job-status-indicator.status-paused { background: linear-gradient(180deg, #c084fc, #a855f7); }

        .job-title-body {
            flex: 1;
            min-width: 0;
        }

        .job-title-name {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--gray-900);
            margin: 0 0 var(--space-2) 0;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .job-title-subtitle {
            font-size: 1rem;
            color: var(--gray-600);
            margin: 0 0 var(--space-3) 0;
            font-weight: 500;
        }

        .job-title-meta {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .meta-separator {
            color: var(--gray-300);
            font-weight: 300;
        }

        .status-text {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-text.status-pending { background: #fef3c7; color: #92400e; }
        .status-text.status-running,
        .status-text.status-processing { background: #dbeafe; color: #1e40af; }
        .status-text.status-completed { background: #d1fae5; color: #065f46; }
        .status-text.status-failed { background: #fee2e2; color: #991b1b; }
        .status-text.status-paused { background: #f3e8ff; color: #6b21a8; }

        .job-target-badges {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--space-2);
        }

        .target-badge-mini {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-3);
            background: var(--gray-100);
            color: var(--gray-700);
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--gray-200);
        }

        .target-badge-more {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gray-500);
            padding: 2px 8px;
            background: var(--gray-100);
            border-radius: var(--radius-full);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: var(--space-12);
            color: var(--gray-500);
        }

        /* Dashboard header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
        }

        .dashboard-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        /* Page header */
        .page-header {
            margin-bottom: var(--space-6);
        }

        .page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: var(--space-2);
        }

        .page-header p {
            color: var(--gray-500);
        }

        /* Form help text */
        .form-help {
            font-size: 0.75rem;
            color: var(--gray-500);
            margin-top: var(--space-1);
        }

        /* Form actions */
        .form-actions {
            display: flex;
            gap: var(--space-3);
            justify-content: flex-end;
            margin-top: var(--space-6);
        }

        /* Job detail */
        .job-detail {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        /* Job controls inline */
        .job-controls-inline {
            display: flex;
            gap: var(--space-3);
            justify-content: flex-end;
            padding: var(--space-3) var(--space-4);
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
        }

        /* UniProt Card */
        .uniprot-card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        /* Logs section */
        .logs-section {
            background: var(--gray-900);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all var(--transition);
        }

        /* Tabs container */
        .tabs-container {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            gap: var(--space-1);
            padding: var(--space-3) var(--space-4);
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        .tab {
            padding: var(--space-2) var(--space-4);
            border: none;
            background: transparent;
            color: var(--gray-600);
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius);
            transition: all var(--transition);
        }

        .tab:hover {
            background: var(--gray-200);
            color: var(--gray-900);
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Tab content */
        .tab-content {
            display: none;
            padding: var(--space-5);
        }

        .tab-content.active {
            display: block;
        }

        /* PDB structures section in report */
        .pdb-structures-section {
            margin-top: var(--space-6);
            border-top: 1px solid var(--gray-200);
            padding-top: var(--space-4);
        }

        .pdb-structures-section h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: var(--space-4);
        }

        .target-pdb-section {
            margin-bottom: var(--space-4);
        }

        .target-pdb-section h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: var(--space-3);
        }

        /* Citations section */
        .citations-section {
            margin-top: var(--space-6);
            padding-top: var(--space-4);
            border-top: 1px solid var(--gray-200);
        }

        .citations-section h3 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: var(--space-4);
        }

        .citations-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .citation-item {
            display: flex;
            gap: var(--space-3);
            padding: var(--space-3);
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
        }

        .citation-number {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: var(--radius-full);
            flex-shrink: 0;
        }

        .citation-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .citation-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gray-900);
            line-height: 1.4;
        }

        .citation-meta {
            display: flex;
            gap: var(--space-2);
            font-size: 0.8rem;
            color: var(--gray-600);
        }

        .citation-journal {
            font-style: italic;
        }

        .citation-year {
            font-weight: 600;
        }

        .citation-links {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-1);
        }

        .citation-link {
            font-size: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            padding: var(--space-1) var(--space-2);
            background: white;
            border: 1px solid var(--primary-light);
            border-radius: var(--radius);
            transition: all var(--transition);
        }

        .citation-link:hover {
            background: var(--primary-light);
            color: var(--primary-hover);
        }

        /* UniProt Card */
        .uniprot-card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .uniprot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-4) var(--space-5);
            background: linear-gradient(135deg, var(--primary-light), #dbeafe);
            border-bottom: 1px solid var(--primary-light);
        }

        .uniprot-main {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .uniprot-id {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .uniprot-name {
            font-size: 1rem;
            font-weight: 500;
            color: var(--gray-700);
        }

        .uniprot-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--space-4);
            padding: var(--space-4) var(--space-5);
            background: white;
        }

        .uniprot-keywords {
            padding: var(--space-3) var(--space-5);
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
        }

        .uniprot-keywords .detail-label {
            display: block;
            margin-bottom: var(--space-2);
        }

        .keywords-list {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }

        .keyword-tag {
            display: inline-flex;
            align-items: center;
            padding: var(--space-1) var(--space-2);
            background: var(--primary-light);
            color: var(--primary-hover);
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .uniprot-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .uniprot-detail-item {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .detail-value {
            font-size: 0.875rem;
            color: var(--gray-900);
            font-weight: 600;
        }

        .detail-value:empty::before {
            content: '-';
            color: var(--gray-400);
        }

        /* Collapsible Logs */
        .logs-section {
            background: var(--gray-900);
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: var(--space-6);
            box-shadow: var(--shadow-md);
            transition: all var(--transition);
        }

        .logs-section.collapsed .log-container {
            display: none;
        }

        .logs-section.collapsed .logs-toggle-icon {
            transform: rotate(-90deg);
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) var(--space-4);
            background: linear-gradient(135deg, #1f2937, #111827);
            border-bottom: 1px solid #374151;
            cursor: pointer;
            user-select: none;
            transition: background var(--transition);
        }

        .logs-header:hover {
            background: linear-gradient(135deg, #2d3748, #1a202c);
        }

        .logs-title {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .logs-toggle-icon {
            width: 18px;
            height: 18px;
            color: #9ca3af;
            transition: transform var(--transition);
        }

        .logs-header h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: #f3f4f6;
            margin: 0;
        }

        .log-count {
            font-size: 0.75rem;
            background: var(--primary);
            color: white;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }

        .log-container {
            max-height: 250px;
            overflow-y: auto;
            padding: var(--space-3);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.6;
            transition: all var(--transition);
        }

        .log-entry {
            display: flex;
            gap: var(--space-3);
            padding: var(--space-2) 0;
            border-bottom: 1px solid #374151;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #9ca3af;
            white-space: nowrap;
            min-width: 60px;
        }

        .log-level {
            font-weight: 600;
            min-width: 50px;
            text-transform: uppercase;
            font-size: 0.625rem;
            padding: 2px 6px;
            border-radius: var(--radius);
            text-align: center;
        }

        .log-level.info {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.15);
        }

        .log-level.success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
        }

        .log-level.warning {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
        }

        .log-level.error {
            color: #f87171;
            background: rgba(248, 113, 113, 0.15);
        }

        .log-message {
            color: #e5e7eb;
            word-break: break-all;
            flex: 1;
        }

        /* Target list */
        .target-list {
            display: grid;
            gap: var(--space-6);
        }

        .target-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-6);
        }

        .target-header {
            padding: var(--space-5);
            background: linear-gradient(135deg, var(--gray-50), white);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .target-body {
            padding: var(--space-5);
        }

        .target-info {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .target-uniprot {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .target-uniprot a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }

        .target-uniprot a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .target-gene {
            font-size: 0.875rem;
            color: var(--gray-500);
            font-weight: 500;
        }

        .target-protein-name {
            font-size: 0.8rem;
            color: var(--gray-600);
            font-style: italic;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .target-metadata-bar {
            display: flex;
            gap: var(--space-4);
            padding: var(--space-2) var(--space-5);
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.8rem;
            color: var(--gray-600);
        }

        .metadata-item strong {
            color: var(--gray-700);
            font-weight: 600;
        }

        .pdb-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-2);
            padding-bottom: var(--space-1);
            border-bottom: 1px solid var(--gray-200);
        }

        /* PDB grid - enhanced */
        .pdb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: var(--space-4);
            margin-top: var(--space-4);
        }

        .pdb-item {
            background: linear-gradient(135deg, white, var(--gray-50));
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
        }

        .pdb-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--primary-light);
        }

        .pdb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-3);
            border-bottom: 1px solid var(--gray-100);
        }

        .pdb-id {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--primary);
        }

        .pdb-id a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }

        .pdb-id a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .pdb-title {
            font-size: 0.8rem;
            color: var(--gray-600);
            margin: var(--space-2) 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pdb-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .pdb-meta span {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        /* Target card - enhanced */
        .target-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--space-6);
        }

        .target-header {
            padding: var(--space-5);
            background: linear-gradient(135deg, var(--gray-50), white);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .target-info {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .target-uniprot {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .target-gene {
            font-size: 0.875rem;
            color: var(--gray-500);
            font-weight: 500;
        }

        .target-body {
            padding: var(--space-5);
        }

        /* Report content */
        .report-content {
            line-height: 1.6;
        }

        /* Settings page */
        .settings-page {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Templates page */
        .templates-page {
            max-width: 800px;
            margin: 0 auto;
        }

        .template-list {
            display: grid;
            gap: var(--space-4);
        }

        .template-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
        }

        .template-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2);
        }

        .template-description {
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .template-actions {
            display: flex;
            gap: var(--space-2);
        }

        /* Error message */
        .error-message {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: var(--space-4);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        /* Loading spinner for JS */
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto var(--space-4);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
